name: Android APK

on:
  push:
    branches:
      - android-touch-controls
  pull_request:
    branches:
      - main
      - android-touch-controls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7
      - name: Build Android web assets
        run: npm run build:android
      - name: Generate Android project
        run: npx cap add android
      - name: Lock Android game to landscape
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          marker = "<activity "
          if marker not in source:
              raise SystemExit("Android activity declaration was not found")
          source = source.replace(marker, '<activity android:screenOrientation="landscape" ', 1)
          manifest.write_text(source)
          PY
      - name: Sync web assets
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openrp-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
